name: Build

on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup qemu
      run: |
        sudo apt update
        sudo apt -y install qemu-system-x86 expect
    - name: Install plan9 binaries from the latest release
      run: |
        gh release download --pattern=x86.tar.gz
        tar zxf x86.tar.gz
        rm -f x86.tar.gz
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660"' \
          | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run tests
      run: |
        ./boot/mkdirs
        ./.github/workflows/build.tcl
